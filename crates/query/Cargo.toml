[package]
name = "cairn-query"
description = "semantic query engine for cairn agent memory"
license = "MIT"
repository = "https://github.com/valtors/cairn"
version = "0.1.1"
edition = "2021"

[dependencies]
cairn-store = { path = "../store", version = "0.1.1" }
